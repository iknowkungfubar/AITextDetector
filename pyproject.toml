[project]
name = "aitextdetector"
version = "0.1.0"
description = "AI text detector training and generation tooling"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["srcgen"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# train.py is a script with a deliberate late sklearn import (E402 = style, safe to suppress)
"srctrain/train.py" = ["E402"]
